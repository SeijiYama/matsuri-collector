name: collect-events

on:
  schedule:
    # 毎日 22:00 UTC = 翌 07:00 JST に実行（cron は UTC 指定）
    - cron: "0 22 * * *"
  workflow_dispatch:        # 手動実行も可能（Actions タブの Run workflow）

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper.py
