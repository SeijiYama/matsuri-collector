const el = id => document.getElementById(id);

function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; }
 
async function loadAll(){
  if(!isConfigured){ ALL = SAMPLE.slice(); return; }
  const c = await getClient();
  const from = new Date(); from.setDate(from.getDate()-31);
  const to   = new Date(); to.setDate(to.getDate()+400);
  const { data, error } = await c.from('events').select('*')
    .gte('end_date', iso(from)).lte('start_date', iso(to))
    .order('start_date',{ascending:true}).limit(5000);
  if(error) throw error;
  ALL = data || [];

function activeFilters(){
  return { region:el('region').value, pref:el('pref').value, city:el('city').value, genre:el('genre').value, kw:el('kw').value.trim() };
}
function pass(e,f){
  if(f.region && e.region!==f.region) return false;
  if(f.pref && e.prefecture!==f.pref) return false;
  if(f.city && e.city!==f.city) return false;
  if(f.genre && e.genre!==f.genre) return false;
  if(f.kw){ const hay=`${e.title||''}${e.description||''}${e.city||''}`; if(!hay.includes(f.kw)) return false; }
  return true;
}
function eventsOnDay(dayISO,f){ return ALL.filter(e => e.start_date<=dayISO && (e.end_date||e.start_date)>=dayISO && pass(e,f)); }
 
function buildFilterOptions(){
  const regions=[...new Set(ALL.map(e=>e.region).filter(Boolean))].sort();
  const genres =[...new Set(ALL.map(e=>e.genre).filter(Boolean))];
  const genreOrder=Object.keys(GENRE_COLORS);
  genres.sort((a,b)=>genreOrder.indexOf(a)-genreOrder.indexOf(b));
  el('region').insertAdjacentHTML('beforeend', regions.map(r=>`<option>${esc(r)}</option>`).join(''));
  el('genre').insertAdjacentHTML('beforeend', genres.map(g=>`<option>${esc(g)}</option>`).join(''));
  refreshPrefOptions(); refreshCityOptions();
}
function refreshPrefOptions(){
  const region=el('region').value;
  const list=[...new Set(ALL.filter(e=>!region||e.region===region).map(e=>e.prefecture).filter(Boolean))].sort();
  el('pref').innerHTML='<option value="">すべて</option>'+list.map(p=>`<option>${esc(p)}</option>`).join('');

function refreshCityOptions(){
  const region=el('region').value, pref=el('pref').value;
  const list=[...new Set(ALL.filter(e=>(!region||e.region===region)&&(!pref||e.prefecture===pref)).map(e=>e.city).filter(Boolean))].sort();
  el('city').innerHTML='<option value="">すべて</option>'+list.map(cc=>`<option>${esc(cc)}</option>`).join('');
}
 
function dateTag(e){
  const d=parseD(e.start_date), m=d.getMonth()+1, day=d.getDate(), w=WD[d.getDay()];
  let range=''; if(e.end_date && e.end_date!==e.start_date){ const en=parseD(e.end_date); range=`<span class="range">〜${en.getMonth()+1}/${en.getDate()}</span>`; }
  return `<div class="datetag" style="background:linear-gradient(180deg,${gcolor(e.genre)},rgba(0,0,0,.18))"><span class="m">${m}月</span><span class="d">${day}</span><span class="w">(${w})</span>${range}</div>`;

  el('m-grid').querySelectorAll('.cell').forEach(c=>c.addEventListener('click',()=>{ selDay=c.dataset.day; renderMonth(); renderDayDetail('m-detail'); }));
  const total=ALL.filter(e=>pass(e,f)).length;
  el('count').innerHTML=`条件に一致 <b>${total}</b> 件（カレンダーは期間を自由に移動できます）`;
  if(selDay) renderDayDetail('m-detail');
}
 
function renderWeek(){
  const f=activeFilters();
  el('legend-w').innerHTML=legendHTML();
  const end=new Date(weekStart); end.setDate(weekStart.getDate()+6);
  el('w-title').textContent=`${weekStart.getMonth()+1}/${weekStart.getDate()} 〜 ${end.getMonth()+1}/${end.getDate()}`;
  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(weekStart); d.setDate(weekStart.getDate()+i); const di=iso(d);
    const evs=eventsOnDay(di,f);
    const isToday=di===todayISO?' today':'';
    const items=evs.map(e=>`<div class="wev" data-day="${di}" style="border-left-color:${gcolor(e.genre)}">${esc(e.title)}<br><span style="color:var(--muted)">${esc(e.prefecture||'')}${esc(e.city||'')}</span></div>`).join('') || `<div style="font-size:11px;color:var(--muted);padding:8px;text-align:center">—</div>`;
    html+=`<div class="wcol${isToday}"><h3>${WD[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}</h3><div class="wc-body">${items}</div></div>`;
  }
  el('w-grid').innerHTML=html;
  el('w-grid').querySelectorAll('.wev').forEach(x=>x.addEventListener('click',()=>{ selDay=x.dataset.day; renderDayDetail('w-detail'); el('w-detail').scrollIntoView({behavior:'smooth',block:'start'}); }));
  const total=ALL.filter(e=>pass(e,f)).length;
  el('count').innerHTML=`条件に一致 <b>${total}</b> 件`;
}
 
function renderDayDetail(target){
  if(!selDay){ el(target).innerHTML=''; return; }
  const f=activeFilters();
  const evs=eventsOnDay(selDay,f).sort((a,b)=> a.start_date<b.start_date?-1:1);
  const d=parseD(selDay);
  el(target).innerHTML=`<h2>${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]}) のイベント <span style="color:var(--muted);font-size:14px">${evs.length}件</span></h2>`
    + (evs.length?`<div class="list">${evs.map(card).join('')}</div>`:`<div class="empty"><p>この日のイベントはありません。</p></div>`);
}
 
function switchView(v){
  view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  el('view-list').classList.toggle('hidden',v!=='list');
  el('view-month').classList.toggle('hidden',v!=='month');
  el('view-week').classList.toggle('hidden',v!=='week');
  rerender();
}
function rerender(){ if(view==='list') renderList(); else if(view==='month') renderMonth(); else renderWeek(); }
 
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.view)));
el('region').addEventListener('change',()=>{ refreshPrefOptions(); refreshCityOptions(); rerender(); });
el('pref').addEventListener('change',()=>{ refreshCityOptions(); rerender(); });
el('city').addEventListener('change',rerender);
el('genre').addEventListener('change',rerender);
let kwT; el('kw').addEventListener('input',()=>{ clearTimeout(kwT); kwT=setTimeout(rerender,220); });
el('reset').addEventListener('click',()=>{ el('region').value='';el('pref').value='';el('city').value='';el('genre').value='';el('kw').value=''; refreshPrefOptions(); refreshCityOptions(); rerender(); });
 
el('m-prev').addEventListener('click',()=>{ monthCursor.setMonth(monthCursor.getMonth()-1); renderMonth(); });
el('m-next').addEventListener('click',()=>{ monthCursor.setMonth(monthCursor.getMonth()+1); renderMonth(); });
el('m-today').addEventListener('click',()=>{ monthCursor=new Date(); monthCursor.setDate(1); selDay=todayISO; renderMonth(); });
el('w-prev').addEventListener('click',()=>{ weekStart.setDate(weekStart.getDate()-7); renderWeek(); });
el('w-next').addEventListener('click',()=>{ weekStart.setDate(weekStart.getDate()+7); renderWeek(); });
el('w-today').addEventListener('click',()=>{ weekStart=startOfWeek(new Date()); renderWeek(); });
 
if(!isConfigured){
  el('banner').innerHTML=`<div class="banner"><span>🏮</span><div><b>デモデータを表示中です。</b> <code>index.html</code> の <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> を設定すると実データに切り替わります。</div></div>`;
}
 
(async ()=>{
  try{ await loadAll(); buildFilterOptions(); rerender(); }
  catch(e){ el('view-list').innerHTML=`<div class="empty"><h3>読み込みに失敗しました</h3><p>Supabase の URL / anon キー、テーブルの公開設定（RLS）をご確認ください。</p></div>`; console.error(e); }
})();
</script>
</body>
</html>
